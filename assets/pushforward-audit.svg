<text x="24" y="419" font-size="13">Gray circle area follows joint mass. Exact coincident atoms aggregated for display. Teal +: one mean per source.</text>
<text x="24" y="442" font-size="13">Same axes: x[-1.5,3], y[-1.6,1.4]. All36 pair atoms and six mean rows remain in JSON; no mass threshold.</text>
<text x="24" y="465" font-size="13">At t=1 full atoms reproduce actual target column masses; mean-map variance is smaller. Neither is a sampled path.</text>
<text x="24" y="488" font-size="13">Moment decomposition is an arithmetic identity, not coupling optimality, geometry recovery or a causal claim.</text>
